spring.application.name=gilam888

spring.datasource.url=jdbc:postgresql://localhost:5432/gilam
spring.datasource.username=postgres
spring.datasource.password=12345678
server.port=80

spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

spring.web.error.include-binding-errors=always

# Root logger
logging.level.root=INFO

# Spring loglari
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO

# Hibernate (ixtiyoriy)
logging.level.org.hibernate=ERROR

# Log fayl
logging.file.name=/root/gilamlogs/gilam.log

spring.main.lazy-initialization=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.main.allow-circular-references=true

# BotFather'dan olingan tokenni shu yerga yozing (production'da environment variable orqali bering)
